name: Build APK

on:
  push:
    branches: [ main, 'dev*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Accept Android SDK licenses
        run: |
          # `yes` ends with SIGPIPE once sdkmanager exits; only sdkmanager's status matters.
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > licenses.log 2>&1
          status=$?
          tail -3 licenses.log
          exit $status

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee test.log
        # Keep going on failure so the next step can surface the details.
        continue-on-error: true

      - name: Show unit-test failures
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "## ❌ Unit tests failed" >> "$GITHUB_STEP_SUMMARY"
          # 1) Compilation errors, if any, from the gradle log.
          if grep -qE "^e: " test.log; then
            echo "### Ошибки компиляции" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: " test.log | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: " test.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          # 2) Failing tests + messages, parsed from the JUnit XML reports.
          #    The parser is written to a file (no heredoc-indentation pitfalls).
          cat > /tmp/parse_junit.py <<'PY'
          import sys, glob, xml.etree.ElementTree as ET
          summary = open(sys.argv[1], "a", encoding="utf-8")
          files = []
          for d in ("app/build/test-results",):
              files += glob.glob(d + "/**/TEST-*.xml", recursive=True)
          any_fail = False
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for tc in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = tc.find(tag)
                      if node is None:
                          continue
                      any_fail = True
                      cls = tc.get("classname", "")
                      name = tc.get("name", "")
                      msg = (node.get("message") or "").strip()
                      body = (node.text or "").strip()
                      first = body.splitlines()[0] if body else ""
                      summary.write("\n**%s.%s**\n\n```\n%s\n%s\n```\n" % (cls, name, msg, first))
                      line = ("%s.%s :: %s %s" % (cls, name, msg, first)).replace("\n", " ")[:300]
                      print("::error::" + line)
          if not any_fail:
              summary.write("\n_(в XML-отчётах нет упавших testcase — вероятно упала компиляция тестов, см. test.log)_\n")
              print("::error::Нет упавших testcase в XML — возможна ошибка компиляции тестов, см. раздел компиляции выше.")
          summary.close()
          PY
          echo "### Упавшие тесты" >> "$GITHUB_STEP_SUMMARY"
          python3 /tmp/parse_junit.py "$GITHUB_STEP_SUMMARY"
          # Full gradle output tail — covers compile errors the XML can't show.
          echo "### Хвост вывода Gradle (test.log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -120 test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Also surface the key error lines as annotations (readable via the API).
          grep -nE "e: |error:|Could not resolve|Could not find|FAILURE:|What went wrong|Caused by|> " test.log \
            | grep -vE "^[0-9]+:> Task |Download" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          exit 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      # F-28: the publishing key, when its secrets are set; without them the release
      # keeps the committed key (updates still install over the current app).
      - name: Publishing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/publish.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/publish.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            { grep -E "^e: |error:|AAPT|Execution failed|Caused by|> " build.log | grep -v "> Task "; echo "----- tail -----"; tail -40 build.log; } | head -70 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bank-aggregator
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
