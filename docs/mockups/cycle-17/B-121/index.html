<title>Удаление правки валюты</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#0F0F10;--bg:#0A0F0E;--pt:#18211F;--pb:#111917;--inset:#0C1211;--fg:#EEF3F0;--muted:#8EA39B;--faint:#56655F;--line:rgba(255,255,255,.08);--brass:#D7A74A;--brass2:#F0C878;--pill:rgba(215,167,74,.15);--bline:rgba(215,167,74,.33);--tint:rgba(215,167,74,.12);--mint:#59E2A6;--coral:#FF8468;--sky:#6CC4E8;--onb:#1A130A;color-scheme:dark}
body{background:var(--page);color:var(--fg);font-family:"Golos Text",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
h1{font-family:Unbounded;font-size:22px;font-weight:600;margin:0 0 6px}
h2{font-family:Unbounded;font-size:18px;font-weight:600;margin:40px 0 4px}
.rec{display:inline-block;background:var(--pill);border:1px solid var(--bline);color:var(--brass2);border-radius:8px;padding:2px 8px;font-size:12px;margin-left:8px;vertical-align:middle;font-family:"Golos Text"}
.pros{font-size:13px;color:var(--muted);max-width:860px;line-height:1.5}.pros b{color:var(--fg);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px;align-items:flex-start}
.cap{color:var(--muted);font-size:12px;margin:8px 0 0;max-width:390px}
.ph{width:min(390px,100%);height:780px;background:var(--bg);border-radius:32px;position:relative;overflow:hidden;border:1px solid var(--line);box-sizing:border-box}
.sb{height:28px}
.hdr{height:64px;display:flex;align-items:center;gap:14px;padding:0 16px;font-family:Unbounded;font-size:18px;font-weight:600}
.tabs{margin:4px 16px 0;background:var(--inset);border-radius:14px;display:flex;padding:3px;font-size:13px;color:var(--muted)}
.tabs span{flex:1;text-align:center;padding:8px 0;border-radius:12px}.tabs .on{background:var(--pill);color:var(--brass2)}
.hero{margin:12px 16px;background:linear-gradient(var(--pt),var(--pb));border-radius:20px;padding:16px;box-shadow:0 0 60px -20px rgba(108,196,232,.35)}
.sum{font-family:Unbounded;font-weight:700;font-size:30px;letter-spacing:-.5px}.sum small{font-size:21px;opacity:.55}
.sub{font-size:13px;color:var(--muted);margin-top:4px}.sub .m{color:var(--fg)}
svg.ch{width:100%;height:120px;margin-top:8px;display:block}
.pc{display:flex;gap:6px;margin-top:6px}.pc span{font-size:12px;padding:4px 10px;border-radius:10px;background:var(--inset);color:var(--muted)}.pc .on{background:var(--pill);color:var(--brass2)}
.day{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:14px 16px 4px}
.hl{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:44px;position:relative}
.hl .t{flex:1;min-width:0}.hl .a{font-size:15px}.hl .b{font-size:12px;color:var(--muted)}
.amt{font-family:Unbounded;font-weight:500;font-size:13px;white-space:nowrap}.amt.p{color:var(--mint)}
.dot{width:32px;height:32px;border-radius:10px;background:var(--inset);display:grid;place-items:center;flex:none;color:var(--sky);font-size:14px}
.bi{width:32px;height:32px;border-radius:50%;background:#b8262b;display:grid;place-items:center;flex:none;font-size:10px;font-weight:700}
.tap::after{content:"";position:absolute;inset:2px 8px;border:1.5px dashed var(--brass);border-radius:12px}
.tag{font-size:11px;padding:2px 6px;border-radius:8px;background:var(--pill);color:var(--brass2);margin-left:6px;vertical-align:1px}
.scrim{position:absolute;inset:0;background:rgba(5,8,7,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--pt),var(--pb));border-radius:28px 28px 0 0;padding:10px 16px 24px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--faint);margin:0 auto 14px}
.sh{display:flex;align-items:center;gap:12px;font-family:Unbounded;font-size:17px;font-weight:600}
.big{font-family:Unbounded;font-weight:600;font-size:22px;margin-top:14px}.big small{font-size:22px;opacity:.75}
.q{font-size:13px;color:var(--muted);margin-top:2px}
.list{background:var(--inset);border:1px solid var(--line);border-radius:16px;margin-top:14px}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:52px;box-sizing:border-box;border-top:1px solid var(--line);position:relative}.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}.li .a{font-size:15px}.li .b{font-size:12px;color:var(--muted)}
.chev{color:var(--faint)}
.wb{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.wb:first-of-type{border-top:0}
.wb .v{font-family:Unbounded;font-size:13px}.wb .was{color:var(--muted)}.wb .now{color:var(--fg)}
.btn{height:52px;border-radius:16px;display:grid;place-items:center;font-size:15px;font-weight:600;margin-top:10px}
.brass{background:linear-gradient(var(--brass2),var(--brass));color:var(--onb)}
.plate{background:var(--inset);border:1px solid var(--line);color:var(--fg)}
.danger{background:rgba(255,132,104,.14);border:1px solid rgba(255,132,104,.4);color:var(--coral)}
.two{display:flex;gap:10px}.two .btn{flex:1}
.lbl{font-size:12px;color:var(--muted);margin-top:14px}
.snack{position:absolute;left:12px;right:12px;bottom:18px;background:var(--pt);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;font-size:14px}.snack b{color:var(--brass2);font-weight:500}
.note{font-size:13px;color:var(--muted);margin-top:10px}
</style>

<h1>B-121 · Удаление ручной правки валюты</h1>
<p class="pros">Сейчас тап по «Переоценке валюты» открывает шторку «Остаток · BSB Bank» — правку <b>текущего</b> остатка, а не той правки. Ниже два варианта, как дать открыть и удалить именно её. Пунктир — место касания.</p>
<div id="out"></div>

<script>
const chart=(step,sel)=>{const pts=step?"0,95 40,93 80,94 120,92 160,90 200,30 230,32 260,31 300,33 330,32":"0,95 40,93 80,94 120,92 160,90 200,91 230,93 260,92 300,94 330,93";
 return `<svg class="ch" viewBox="0 0 330 120" preserveAspectRatio="none"><defs><linearGradient id="g${step}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6CC4E8" stop-opacity=".25"/><stop offset="1" stop-color="#6CC4E8" stop-opacity="0"/></linearGradient></defs><polygon points="${pts} 330,120 0,120" fill="url(#g${step})"/><polyline points="${pts}" fill="none" stroke="#6CC4E8" stroke-width="2"/>${sel?`<line x1="200" x2="200" y1="0" y2="120" stroke="rgba(255,255,255,.15)"/>`:""}<circle cx="330" cy="${step?32:93}" r="4" fill="#6CC4E8"/></svg>`};
const screen=(step,extra,rows)=>`<div class="ph"><div class="sb"></div><div class="hdr">← <span>История капитала</span></div>
<div class="tabs"><span>Всё</span><span>Счета</span><span>Вклады</span><span class="on">Валюта</span><span>Наличные</span></div>
<div class="hero"><div class="sum">${step?"1 621 748<small>,76 ₽</small>":"810 641<small>,30 ₽</small>"}</div>
<div class="sub">${step?'<span class="m">+811 107 ₽</span> · 100% с 7 октября':'<span class="m">+2 140 ₽</span> · 0,3% с 7 октября'}</div>${chart(step)}
<div class="pc"><span>Неделя</span><span class="on">Месяц</span><span>Год</span><span>Всё</span></div></div>
${rows}${extra||""}</div>`;
const sheetWrap=s=>`<div class="scrim"></div><div class="sheet"><div class="grab"></div>${s}</div>`;

// Вариант 1: правка — своя строка в истории
const v1rows=(tap)=>`<div class="day">27 октября</div>
<div class="hl ${tap?"tap":""}"><div class="bi">BSB</div><div class="t"><div class="a">Правка остатка<span class="tag">вручную</span></div><div class="b">BSB Bank · $ ›</div></div><div class="amt p">+811 107,46 ₽</div></div>
<div class="hl"><div class="dot">$</div><div class="t"><div class="a">Переоценка валюты</div><div class="b">$ · € ⌄</div></div><div class="amt">−1 240,12 ₽</div></div>
<div class="day">26 октября</div>
<div class="hl"><div class="dot">$</div><div class="t"><div class="a">Покупка валюты</div><div class="b">Т-Банк · € ›</div></div><div class="amt p">+500 €</div></div>`;
const v1sheet=sheetWrap(`<div class="sh"><div class="bi">BSB</div>Правка остатка · BSB Bank</div>
<div class="big">+811 107<small>,46 ₽</small></div><div class="q">27 октября, 21:14 · внесена вручную</div>
<div class="list"><div class="wb" style="padding:10px 14px"><span>Остаток счёта</span><span class="v"><span class="was">91,28 $</span> → 9 091,28 $</span></div></div>
<div class="two" style="margin-top:14px"><div class="btn plate">Изменить</div><div class="btn danger">Удалить</div></div>`);
const confirm=(title)=>sheetWrap(`<div class="sh">${title}</div>
<div class="list" style="padding:0 14px"><div class="wb"><span>Валюта</span><span class="v"><span class="was">1 621 748 ₽</span> → <span class="now">810 641 ₽</span></span></div><div class="wb"><span>Капитал</span><span class="v"><span class="was">4 932 510 ₽</span> → <span class="now">4 121 403 ₽</span></span></div><div class="wb"><span>Остаток BSB Bank сейчас</span><span class="v now">91,28 $</span></div></div>
<div class="note">График пересчитается с 27 октября.</div>
<div class="two" style="margin-top:14px"><div class="btn plate">Оставить</div><div class="btn danger">Удалить правку</div></div>`);
const after=(rows)=>screen(false,`<div class="snack">Правка удалена<b>Вернуть</b></div>`,rows);
const v1after=`<div class="day">27 октября</div><div class="hl"><div class="dot">$</div><div class="t"><div class="a">Переоценка валюты</div><div class="b">$ · € ⌄</div></div><div class="amt">−1 240,12 ₽</div></div><div class="day">26 октября</div><div class="hl"><div class="dot">$</div><div class="t"><div class="a">Покупка валюты</div><div class="b">Т-Банк · € ›</div></div><div class="amt p">+500 €</div></div>`;

// Вариант 2: внутри переоценки
const v2rows=(open,tap)=>`<div class="day">27 октября</div>
<div class="hl ${tap&&!open?"tap":""}"><div class="dot">$</div><div class="t"><div class="a">Переоценка валюты</div><div class="b">$ · € · вручную ${open?"⌃":"⌄"}</div></div><div class="amt p">+809 867,34 ₽</div></div>
${open?`<div class="hl" style="padding-left:60px"><div class="t"><div class="a" style="font-size:14px">Курс $</div></div><div class="amt">−1 012,40 ₽</div></div>
<div class="hl" style="padding-left:60px"><div class="t"><div class="a" style="font-size:14px">Курс €</div></div><div class="amt">−227,72 ₽</div></div>
<div class="hl ${tap?"tap":""}" style="padding-left:60px"><div class="t"><div class="a" style="font-size:14px">Правка · BSB Bank<span class="tag">вручную</span></div><div class="b">›</div></div><div class="amt p">+811 107,46 ₽</div></div>`:""}`;
const v2sheet=sheetWrap(`<div class="sh"><div class="bi">BSB</div>Правка · BSB Bank</div>
<div class="big">+811 107<small>,46 ₽</small></div><div class="q">27 октября, 21:14 · часть переоценки</div>
<div class="list"><div class="wb" style="padding:10px 14px"><span>Остаток счёта</span><span class="v"><span class="was">91,28 $</span> → 9 091,28 $</span></div></div>
<div class="btn danger" style="margin-top:14px">Удалить правку</div>`);

const V=[
 {t:"Вариант 1 · правка — отдельная строка истории",rec:true,
  p:"<b>Как:</b> ручная правка перестаёт прятаться в «Переоценке валюты» и идёт своей строкой «Правка остатка» с меткой «вручную» (это действие человека, а не курс). Касание → обычная шторка операции (F-51): сумма, дата, счёт, «было → стало», «Изменить» / «Удалить». Удаление — подтверждение в той же шторке и снекбар «Вернуть». <b>Плюс:</b> один путь для всех операций, два касания до удаления, ошибку видно сразу в ленте. Отметка на графике — как у действия.",
  f:[[screen(true,"",v1rows(true)),"История: правка — своя строка, касание открывает её"],[screen(true,v1sheet,v1rows(false)),"Шторка правки (F-51): было → стало"],[screen(true,confirm("Удалить правку?"),v1rows(false)),"Подтверждение в той же шторке"],[after(v1after),"После: ступеньки нет, строка ушла, снекбар «Вернуть»"]]},
 {t:"Вариант 2 · правка внутри переоценки",rec:false,
  p:"<b>Как:</b> строка остаётся «Переоценка валюты» с подписью «· вручную»; раскрывается на части (курс $, курс €, «Правка · BSB Bank»), касание по части-правке открывает шторку только с «Удалить правку». <b>Плюс:</b> меньше меняется в ленте. <b>Минус:</b> три касания, итог дня смешивает курс и ошибку человека (+809 867 вместо видимых +811 107), правку нельзя поправить — только удалить.",
  f:[[screen(true,"",v2rows(true,true)),"Раскрытая переоценка, касание по части «Правка»"],[screen(true,v2sheet,v2rows(true,false)),"Шторка правки — только «Удалить правку»"],[screen(true,confirm("Удалить правку?"),v2rows(true,false)),"Подтверждение"],[after(v1after),"После: ступеньки нет"]]}];
let h="";
for(const v of V){h+=`<h2>${v.t}${v.rec?'<span class="rec">рекомендую</span>':""}</h2><p class="pros">${v.p}</p><div class="row">`;
 for(const [s,c] of v.f)h+=`<div>${s}<p class="cap">${c}</p></div>`;h+=`</div>`}
h+=`<h2>Тексты</h2><p class="pros">«Правка остатка» · «вручную» · «Удалить» → «Удалить правку?» · «Оставить» / «Удалить правку» · «График пересчитается с 27 октября.» · снекбар «Правка удалена» · «Вернуть». Текущий остаток счёта (91,28 $) не меняется — это видно строкой в подтверждении.</p>`;
document.getElementById("out").innerHTML=h;
</script>
