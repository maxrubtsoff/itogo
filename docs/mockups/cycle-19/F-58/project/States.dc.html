<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка трат · состояния</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0F0E}
.scr{--bg:#0A0F0E;--pt:#18211F;--pb:#111917;--inset:#0C1211;--fg:#EEF3F0;--muted:#8EA39B;--faint:#56655F;--line:rgba(255,255,255,.08);--brass:#D7A74A;--brass2:#F0C878;--onbrass:#1A130A;--mint:#59E2A6;--U:'Unbounded',sans-serif;--G:'Golos Text',sans-serif;background:var(--bg);color:var(--fg);font-family:var(--G);overflow:hidden;box-sizing:border-box}
.scr *{box-sizing:border-box}
.panel{background:linear-gradient(180deg,var(--pt),var(--pb));border:1px solid var(--line);border-radius:20px;overflow:hidden}
.lg{font:600 22px/26px var(--U);letter-spacing:-.2px;font-feature-settings:"tnum"}
.lg .k{font-size:.7em;opacity:.55}
.sm{font:600 13px/16px var(--U);font-feature-settings:"tnum";white-space:nowrap}
.m14{font:500 14px/18px var(--U);font-feature-settings:"tnum";white-space:nowrap}
.m14 .k{opacity:.75}
.b16{font:400 16px/22px var(--G)}
.b14{font:400 14px/20px var(--G)}
.b12{font:400 12px/16px var(--G);color:var(--muted)}
.mi{color:var(--mint)}.mu{color:var(--muted)}
.cap{font:600 11px/14px var(--G);letter-spacing:.6px;text-transform:uppercase;color:var(--faint);padding:24px 20px 8px}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--G);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
.bar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin:18px 16px 6px}
.bar span{display:block;height:100%;min-width:3px}
.srow{display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 16px;background:none;border:0;color:inherit;width:100%;text-align:left;font:inherit}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;padding:16px 16px 0}
.col{height:86px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;background:none;border:0;padding:0;font:inherit}
.col i{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:rgba(238,243,240,.14)}
.col.on i{background:var(--brass)}
.col span{font:400 12px/16px var(--G);color:var(--muted)}
.col.on span{color:var(--brass2)}
.swrow{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;background:none;border:0;border-top:1px solid var(--line);color:inherit;width:100%;text-align:left;font:inherit}
.sw{width:52px;height:32px;border-radius:16px;background:var(--inset);border:1px solid var(--line);position:relative;flex:none;display:block}
.sw::after{content:"";position:absolute;left:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--muted)}
.grow{flex:1;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 16px}
</style>
</helmet>
<div class="scr" style="width:390px;height:1420px">

  <div class="cap">Нет трат в этом месяце</div>
  <section class="panel" style="margin:0 16px;padding:16px 0 16px">
    <div class="head">
      <div><div class="b12">С 1 ноября</div><div class="b14 mu" style="margin-top:6px">Трат пока нет</div></div>
    </div>
    <div class="cols">
      <button class="col"><i style="height:51px"></i><span>июн</span></button>
      <button class="col"><i style="height:60px"></i><span>июл</span></button>
      <button class="col"><i style="height:47px"></i><span>авг</span></button>
      <button class="col"><i style="height:56px"></i><span>сен</span></button>
      <button class="col"><i style="height:48px"></i><span>окт</span></button>
      <button class="col on"><i style="height:2px"></i><span>ноя</span></button>
    </div>
  </section>

  <div class="cap">Один банк</div>
  <section class="panel" style="margin:0 16px;padding:16px 0 0">
    <div class="head">
      <div><div class="b12">Потрачено с 1 ноября</div><div class="lg" style="margin-top:4px">18 505<span class="k">,50</span> ₽</div></div>
      <div style="text-align:right"><div class="b12">Пришло</div><div class="sm mi" style="margin-top:8px">+95 000 ₽</div></div>
    </div>
    <div class="cols">
      <button class="col"><i style="height:51px"></i><span>июн</span></button>
      <button class="col"><i style="height:60px"></i><span>июл</span></button>
      <button class="col"><i style="height:47px"></i><span>авг</span></button>
      <button class="col"><i style="height:56px"></i><span>сен</span></button>
      <button class="col"><i style="height:48px"></i><span>окт</span></button>
      <button class="col on"><i style="height:18px"></i><span>ноя</span></button>
    </div>
    <div style="height:10px"></div>
    <button class="srow"><span class="logo" style="background:#21A038;color:#FFFFFF">С</span><span class="grow"><span style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="b16">Сбер</span><span class="m14">18 505<span class="k">,50</span> ₽</span></span><span class="b12" style="display:block;margin-top:2px">32 операции</span></span></button>
  </section>

  <div class="cap">Много банков</div>
  <section class="panel" style="margin:0 16px;padding:16px 0 0">
    <div class="head">
      <div><div class="b12">Потрачено в октябре</div><div class="lg" style="margin-top:4px">63 240 ₽</div></div>
      <div style="text-align:right"><div class="b12">Пришло</div><div class="sm mi" style="margin-top:8px">+142 300 ₽</div></div>
    </div>
    <div class="cols">
      <button class="col"><i style="height:50px"></i><span>май</span></button>
      <button class="col"><i style="height:51px"></i><span>июн</span></button>
      <button class="col"><i style="height:60px"></i><span>июл</span></button>
      <button class="col"><i style="height:47px"></i><span>авг</span></button>
      <button class="col"><i style="height:56px"></i><span>сен</span></button>
      <button class="col on"><i style="height:61px"></i><span>окт</span></button>
    </div>
    <div class="bar">
      <span style="flex:21400 0 0;background:#FFDD2D"></span><span style="flex:14800 0 0;background:#21A038"></span><span style="flex:10200 0 0;background:#EF3124"></span><span style="flex:7900 0 0;background:#3D6FE8"></span><span style="flex:4100 0 0;background:#8A5CF0"></span><span style="flex:3100 0 0;background:#E8833A"></span><span style="flex:1740 0 0;background:#2FB8C9"></span>
    </div>
    <button class="srow"><span class="logo" style="background:#FFDD2D;color:#14120E">Т</span><span class="grow"><span style="display:flex;justify-content:space-between;gap:8px"><span class="b16">Т-Банк</span><span class="m14">21 400 ₽</span></span><span class="b12" style="display:block;margin-top:2px">36 операций</span></span></button>
    <button class="srow"><span class="logo" style="background:#21A038;color:#FFFFFF">С</span><span class="grow"><span style="display:flex;justify-content:space-between;gap:8px"><span class="b16">Сбер</span><span class="m14">14 800 ₽</span></span><span class="b12" style="display:block;margin-top:2px">23 операции</span></span></button>
    <button class="srow"><span class="logo" style="background:#EF3124;color:#FFFFFF">А</span><span class="grow"><span style="display:flex;justify-content:space-between;gap:8px"><span class="b16">Альфа-Банк</span><span class="m14">10 200 ₽</span></span><span class="b12" style="display:block;margin-top:2px">15 операций</span></span></button>
    <button class="srow"><span class="logo" style="background:#3D6FE8;color:#FFFFFF">В</span><span class="grow"><span style="display:flex;justify-content:space-between;gap:8px"><span class="b16">ВТБ</span><span class="m14">7 900 ₽</span></span><span class="b12" style="display:block;margin-top:2px">4 операции</span></span></button>
    <button class="srow" aria-expanded="false"><span class="logo" style="background:#0C1211;color:#8EA39B;font-size:13px">+3</span><span class="grow"><span style="display:flex;justify-content:space-between;gap:8px"><span class="b16">Ещё 3 банка</span><span class="m14">8 940 ₽</span></span><span class="b12" style="display:block;margin-top:2px">Точка, Ozon Банк, Газпромбанк <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></span></button>
    <button class="swrow" role="switch" aria-checked="false"><span class="grow"><span class="b16" style="display:block">Переводы людям</span><span class="b12" style="display:block;margin-top:2px">4 перевода · 25 000 ₽</span></span><span class="sw" aria-hidden="true"></span></button>
  </section>

  <div class="cap">Ни одной траты за всю историю — карточки нет</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>

</body>
</html>
