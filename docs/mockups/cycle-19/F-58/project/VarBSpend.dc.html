body{margin:0;background:#0A0F0E}
.scr{--bg:#0A0F0E;--pt:#18211F;--pb:#111917;--inset:#0C1211;--fg:#EEF3F0;--muted:#8EA39B;--faint:#56655F;--line:rgba(255,255,255,.08);--brass:#D7A74A;--brass2:#F0C878;--mint:#59E2A6;--pill:rgba(215,167,74,.15);--bline:rgba(215,167,74,.33);--U:'Unbounded',sans-serif;--G:'Golos Text',sans-serif;background:var(--bg);color:var(--fg);font-family:var(--G);overflow:hidden;box-sizing:border-box}
.scr *{box-sizing:border-box}
.hdr{height:64px;display:flex;align-items:center;gap:4px;padding:0 8px}
.ib{width:48px;height:48px;display:grid;place-items:center;background:none;border:0;color:var(--fg);padding:0;text-decoration:none}

.panel{background:linear-gradient(180deg,var(--pt),var(--pb));border:1px solid var(--line);border-radius:20px;position:relative;overflow:hidden}
.lg{font:600 22px/26px var(--U);letter-spacing:-.2px;font-feature-settings:"tnum"}
.lg .k{font-size:.7em;opacity:.55}
.sm{font:600 13px/16px var(--U);font-feature-settings:"tnum";white-space:nowrap}
.m14{font:500 14px/18px var(--U);font-feature-settings:"tnum";white-space:nowrap}
.sm .k,.m14 .k{opacity:.75}
.b16{font:400 16px/22px var(--G)}
.b12{font:400 12px/16px var(--G);color:var(--muted)}
.mu{color:var(--muted)}.mi{color:var(--mint)}
.month{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 4px;border:0;background:none;color:var(--fg);font:600 16px/20px var(--G)}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--G);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
.srow{display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 16px;background:none;border:0;color:inherit;width:100%;text-align:left;font:inherit}
.swrow{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;background:none;border:0;border-top:1px solid var(--line);color:inherit;width:100%;text-align:left;font:inherit}
.sw{width:52px;height:32px;border-radius:16px;background:var(--inset);border:1px solid var(--line);position:relative;flex:none;display:block}
.sw::after{content:"";position:absolute;left:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--muted)}
.chips{display:flex;gap:8px;padding:20px 16px 0;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 4px;border-radius:20px;background:var(--inset);border:1px solid var(--line);color:var(--muted);font:500 14px/18px var(--G);white-space:nowrap;flex:none}
.chip.txt{padding:0 14px}
.chip.on{background:var(--pill);border-color:var(--bline);color:var(--brass2)}
.chip .lo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--G)}
.day{font:400 14px/20px var(--G);color:var(--muted);padding:18px 20px 8px}
.grp{margin:0 16px}
.hl{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 16px}
.hl+.hl{border-top:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--brass)}
.grow{flex:1;min-width:0}
</style>
