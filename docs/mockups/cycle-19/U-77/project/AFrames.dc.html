<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вариант А · жесты по кадрам</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0F0E}
.scr{--bg:#0A0F0E;--pt:#18211F;--pb:#111917;--inset:#0C1211;--fg:#EEF3F0;--muted:#8EA39B;--faint:#56655F;--line:rgba(255,255,255,.08);--brass2:#F0C878;--mint:#59E2A6;--pill:rgba(215,167,74,.15);--bline:rgba(215,167,74,.33);--U:'Unbounded',sans-serif;--G:'Golos Text',sans-serif;background:var(--bg);color:var(--fg);font-family:var(--G);overflow:hidden;box-sizing:border-box}
.scr *{box-sizing:border-box}
.panel{background:linear-gradient(180deg,var(--pt),var(--pb));border:1px solid var(--line);border-radius:20px;position:relative;overflow:visible}
.hero{font:700 34px/38px var(--U);letter-spacing:-.5px;font-feature-settings:"tnum"}
.b14{font:400 14px/20px var(--G)}
.ax{font:400 11px/14px var(--G);color:var(--faint)}
.step{font:500 13px/18px var(--G);color:var(--muted);padding:0 4px 12px;min-height:48px}
.step b{color:var(--brass2);font-weight:600}
.pc{height:30px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--inset);color:var(--muted);font:500 13px/1 var(--G)}
.pc.on{background:var(--pill);border-color:var(--bline);color:var(--brass2)}
.mini{display:block;width:100%;height:44px;padding:8px 0;background:none;border:0}
.finger{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid rgba(240,200,120,.85);background:rgba(240,200,120,.2);pointer-events:none}
.arrow{position:absolute;width:36px;height:20px;pointer-events:none}
</style>
</helmet>
<div class="scr" style="width:2270px;height:600px;display:flex;gap:80px;padding-top:24px">
  <sc-for list="{{frames}}" as="f" hint-placeholder-count="5">
    <div style="width:390px;flex:none;padding:0 16px">
      <div class="step"><b>{{f.n}}</b> {{f.cap}}</div>
      <section class="panel" style="padding:18px 16px 12px">
        <div class="hero">{{f.sum}}</div>
        <div class="b14" style="margin-top:4px"><span style="{{f.l1s}}">{{f.l1}}</span> <span style="color:#8EA39B">{{f.l1b}}</span></div>
        <sc-if value="{{f.hasL2}}" hint-placeholder-val="{{false}}"><div class="b14" style="color:#59E2A6">{{f.l2}}</div></sc-if>
        <svg width="326" height="150" viewBox="0 0 326 150" style="display:block;margin-top:14px" aria-hidden="true">
          <path d="{{f.fill}}" fill="rgba(240,200,120,.08)"></path>
          <path d="{{f.d}}" fill="none" stroke="#F0C878" stroke-width="2" stroke-linejoin="round"></path>
          <sc-if value="{{f.scrub}}" hint-placeholder-val="{{false}}">
            <line x1="187" y1="0" x2="187" y2="150" stroke="rgba(238,243,240,.25)" stroke-width="1"></line>
            <circle cx="187" cy="55" r="8" fill="#0A0F0E"></circle><circle cx="187" cy="55" r="5" fill="#F0C878"></circle>
          </sc-if>
        </svg>
        <div style="display:flex;justify-content:space-between;margin-top:6px"><span class="ax">{{f.a1}}</span><span class="ax">{{f.a2}}</span><span class="ax">{{f.a3}}</span></div>
        <div class="mini">
          <svg width="326" height="28" viewBox="0 0 326 28" aria-hidden="true" style="display:block">
            <rect x="0" y="0" width="326" height="28" rx="8" fill="#0C1211"></rect>
            <path d="M0,22 L10,21 L20,22 L30,20 L40,19 L50,20 L60,18 L70,17 L80,18 L90,15 L100,16 L110,14 L120,15 L130,12 L140,13 L150,11 L160,12 L170,9 L180,10 L190,8 L200,11 L210,10 L220,7 L230,8 L240,6 L250,9 L260,7 L270,5 L280,6 L290,4 L300,8 L310,6 L326,5" fill="none" stroke="#56655F" stroke-width="1.5" stroke-linejoin="round"></path>
            <rect x="{{f.wx}}" y="0.75" width="{{f.ww}}" height="26.5" rx="6" fill="rgba(215,167,74,.12)" stroke="rgba(215,167,74,.55)" stroke-width="1.5"></rect>
            <rect x="{{f.h1}}" y="8" width="3" height="12" rx="1.5" fill="#F0C878"></rect>
            <rect x="{{f.h2}}" y="8" width="3" height="12" rx="1.5" fill="#F0C878"></rect>
          </svg>
        </div>
        <div style="display:flex;gap:6px;margin-top:4px">
          <sc-for list="{{f.chips}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}">{{c.t}}</button></sc-for>
        </div>
        <sc-for list="{{f.fingers}}" as="g" hint-placeholder-count="0"><span class="finger" style="{{g}}"></span></sc-for>
        <sc-for list="{{f.arrows}}" as="a" hint-placeholder-count="0"><svg class="arrow" style="{{a}}" viewBox="0 0 36 20" fill="none" stroke="#F0C878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10h30M25 4l7 6-7 6"></path></svg></sc-for>
      </section>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2270,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const FULL = 'M0,120 L10,115 L20,120 L30,110 L40,105 L50,110 L60,100 L70,95 L80,100 L90,85 L100,90 L110,80 L120,85 L130,70 L140,75 L150,65 L160,70 L170,55 L180,60 L190,50 L200,65 L210,60 L220,45 L230,50 L240,40 L250,55 L260,45 L270,35 L280,40 L290,30 L300,50 L310,40 L326,35';
    const ZOOM = 'M0,96 L8,94 L16,97 L24,92 L33,90 L41,93 L49,88 L57,86 L65,89 L73,84 L81,80 L90,82 L98,78 L106,81 L114,74 L122,72 L130,76 L138,70 L147,66 L155,69 L163,62 L171,58 L179,61 L187,55 L196,52 L204,57 L212,50 L220,46 L228,49 L236,44 L245,40 L253,43 L261,38 L269,60 L277,74 L285,70 L294,66 L302,68 L310,63 L318,60 L326,62';
    const SHIFT = 'M0,104 L8,100 L16,103 L24,98 L33,96 L41,99 L49,94 L57,95 L65,90 L73,92 L81,88 L90,90 L98,84 L106,86 L114,82 L122,84 L130,79 L138,80 L147,76 L155,78 L163,72 L171,74 L179,70 L187,73 L196,68 L204,70 L212,66 L220,68 L228,62 L236,64 L245,60 L253,63 L261,58 L269,60 L277,56 L285,59 L294,54 L302,57 L310,52 L318,55 L326,50';
    const fill = (d) => d + ' L326,150 L0,150Z';
    const chips = (on) => ['Неделя', 'Месяц', 'Год', 'Всё'].map((t, i) => ({ t, cls: i === on ? 'pc on' : 'pc' }));
    const win = (x, w) => ({ wx: x + 0.75, ww: w - 1.5, h1: x - 1.5, h2: x + w - 1.5 });
    const mint = 'color:#59E2A6';
    const base = { hasL2: false, l2: '', scrub: false, fingers: [], arrows: [] };
    return {
      frames: [
        Object.assign({}, base, win(0, 326), { n: '1', cap: '«Всё». Развести два пальца на графике', sum: '1 412 000 ₽', l1: '+412 000 ₽ · +41 %', l1s: mint, l1b: 'с 9 ноября 2025', d: FULL, fill: fill(FULL), a1: 'ноя 2025', a2: 'май', a3: 'сегодня', chips: chips(3),
          fingers: ['left:124px;top:134px', 'left:200px;top:134px'], arrows: ['left:84px;top:144px;transform:rotate(180deg)', 'left:246px;top:144px'] }),
        Object.assign({}, base, win(130, 70), { n: '2', cap: 'Окно 12 марта – 30 мая: даты под суммой, рамка на мини-карте, плашки не выбраны', sum: '1 186 420 ₽', l1: '+96 300 ₽ · +8,8 %', l1s: mint, l1b: '12 марта – 30 мая', d: ZOOM, fill: fill(ZOOM), a1: '12 мар', a2: '20 апр', a3: '30 мая', chips: chips(-1) }),
        Object.assign({}, base, win(90, 70), { n: '3', cap: 'Тянуть окно по мини-карте одним пальцем (или двумя по графику)', sum: '1 132 800 ₽', l1: '+71 900 ₽ · +6,8 %', l1s: mint, l1b: '1 февраля – 19 апреля', d: SHIFT, fill: fill(SHIFT), a1: '1 фев', a2: '10 мар', a3: '19 апр', chips: chips(-1),
          fingers: ['left:121px;top:266px'], arrows: ['left:76px;top:276px;transform:rotate(180deg)'] }),
        Object.assign({}, base, win(130, 70), { n: '4', cap: 'Один палец по графику — точка дня, как сейчас', sum: '1 104 200 ₽', l1: '14 апреля, вторник', l1s: 'color:#F0C878', l1b: '', hasL2: true, l2: '+2 300 ₽ за день', scrub: true, d: ZOOM, fill: fill(ZOOM), a1: '12 мар', a2: '20 апр', a3: '30 мая', chips: chips(-1),
          fingers: ['left:183px;top:169px'] }),
        Object.assign({}, base, win(0, 326), { n: '5', cap: 'Касание «Всё» — снова вся история', sum: '1 412 000 ₽', l1: '+412 000 ₽ · +41 %', l1s: mint, l1b: 'с 9 ноября 2025', d: FULL, fill: fill(FULL), a1: 'ноя 2025', a2: 'май', a3: 'сегодня', chips: chips(3),
          fingers: ['left:236px;top:312px'] })
      ]
    };
  }
}
</script>
</body>
</html>
