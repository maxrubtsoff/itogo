<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вариант Б · жесты по кадрам</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0F0E}
.scr{--bg:#0A0F0E;--pt:#18211F;--pb:#111917;--inset:#0C1211;--fg:#EEF3F0;--muted:#8EA39B;--faint:#56655F;--line:rgba(255,255,255,.08);--brass2:#F0C878;--mint:#59E2A6;--pill:rgba(215,167,74,.15);--bline:rgba(215,167,74,.33);--U:'Unbounded',sans-serif;--G:'Golos Text',sans-serif;background:var(--bg);color:var(--fg);font-family:var(--G);overflow:hidden;box-sizing:border-box}
.scr *{box-sizing:border-box}
.panel{background:linear-gradient(180deg,var(--pt),var(--pb));border:1px solid var(--line);border-radius:20px;position:relative;overflow:visible}
.hero{font:700 34px/38px var(--U);letter-spacing:-.5px;font-feature-settings:"tnum"}
.b14{font:400 14px/20px var(--G)}
.b12{font:400 12px/16px var(--G);color:var(--muted)}
.ax{font:400 11px/14px var(--G);color:var(--faint)}
.step{font:500 13px/18px var(--G);color:var(--muted);padding:0 4px 12px;min-height:48px}
.step b{color:var(--brass2);font-weight:600}
.pc{height:30px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--inset);color:var(--muted);font:500 13px/1 var(--G)}
.pc.on{background:var(--pill);border-color:var(--bline);color:var(--brass2)}
.finger{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid rgba(240,200,120,.85);background:rgba(240,200,120,.2);pointer-events:none}
.hold{position:absolute;width:60px;height:60px;border-radius:50%;border:1.5px dashed rgba(240,200,120,.6);pointer-events:none}
.arrow{position:absolute;width:36px;height:20px;pointer-events:none}
</style>
</helmet>
<div class="scr" style="width:1820px;height:600px;display:flex;gap:80px;padding-top:24px">
  <sc-for list="{{frames}}" as="f" hint-placeholder-count="4">
    <div style="width:390px;flex:none;padding:0 16px">
      <div class="step"><b>{{f.n}}</b> {{f.cap}}</div>
      <section class="panel" style="padding:18px 16px 14px">
        <div class="hero">{{f.sum}}</div>
        <div class="b14" style="{{f.l1s}};margin-top:4px">{{f.l1}}</div>
        <div style="display:flex;justify-content:space-between;margin-top:12px"><span class="b12" style="color:#EEF3F0">{{f.range}}</span><span class="b12">{{f.more}}</span></div>
        <div style="position:relative;margin-top:6px">
          <svg width="326" height="150" viewBox="0 0 326 150" style="display:block" aria-hidden="true">
            <path d="{{f.fill}}" fill="rgba(240,200,120,.08)"></path>
            <path d="{{f.d}}" fill="none" stroke="#F0C878" stroke-width="2" stroke-linejoin="round"></path>
            <sc-if value="{{f.scrub}}" hint-placeholder-val="{{false}}">
              <line x1="187" y1="0" x2="187" y2="150" stroke="rgba(238,243,240,.25)" stroke-width="1"></line>
              <circle cx="187" cy="55" r="8" fill="#0A0F0E"></circle><circle cx="187" cy="55" r="5" fill="#F0C878"></circle>
            </sc-if>
          </svg>
          <sc-if value="{{f.fades}}" hint-placeholder-val="{{true}}">
            <div style="position:absolute;left:0;top:0;bottom:0;width:36px;background:linear-gradient(90deg,#16201E,rgba(22,32,30,0))"></div>
            <div style="position:absolute;right:0;top:0;bottom:0;width:36px;background:linear-gradient(270deg,#16201E,rgba(22,32,30,0))"></div>
          </sc-if>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px"><span class="ax">{{f.a1}}</span><span class="ax">{{f.a2}}</span><span class="ax">{{f.a3}}</span></div>
        <div style="display:flex;gap:6px;margin-top:12px">
          <sc-for list="{{f.chips}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}">{{c.t}}</button></sc-for>
        </div>
        <sc-for list="{{f.holds}}" as="h" hint-placeholder-count="0"><span class="hold" style="{{h}}"></span></sc-for>
        <sc-for list="{{f.fingers}}" as="g" hint-placeholder-count="0"><span class="finger" style="{{g}}"></span></sc-for>
        <sc-for list="{{f.arrows}}" as="a" hint-placeholder-count="0"><svg class="arrow" style="{{a}}" viewBox="0 0 36 20" fill="none" stroke="#F0C878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10h30M25 4l7 6-7 6"></path></svg></sc-for>
      </section>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1820,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const FULL = 'M0,120 L10,115 L20,120 L30,110 L40,105 L50,110 L60,100 L70,95 L80,100 L90,85 L100,90 L110,80 L120,85 L130,70 L140,75 L150,65 L160,70 L170,55 L180,60 L190,50 L200,65 L210,60 L220,45 L230,50 L240,40 L250,55 L260,45 L270,35 L280,40 L290,30 L300,50 L310,40 L326,35';
    const ZOOM = 'M0,96 L8,94 L16,97 L24,92 L33,90 L41,93 L49,88 L57,86 L65,89 L73,84 L81,80 L90,82 L98,78 L106,81 L114,74 L122,72 L130,76 L138,70 L147,66 L155,69 L163,62 L171,58 L179,61 L187,55 L196,52 L204,57 L212,50 L220,46 L228,49 L236,44 L245,40 L253,43 L261,38 L269,60 L277,74 L285,70 L294,66 L302,68 L310,63 L318,60 L326,62';
    const fill = (d) => d + ' L326,150 L0,150Z';
    const chips = (on) => ['Неделя', 'Месяц', 'Год', 'Всё'].map((t, i) => ({ t, cls: i === on ? 'pc on' : 'pc' }));
    const mint = 'color:#59E2A6';
    const base = { scrub: false, fingers: [], arrows: [], holds: [] };
    const all = { sum: '1 412 000 ₽', l1: '+412 000 ₽ · +41 %', l1s: mint, range: '9 ноября 2025 – сегодня', more: '', d: FULL, fill: fill(FULL), a1: 'ноя 2025', a2: 'май', a3: 'сегодня', chips: chips(3), fades: false };
    const zoom = { sum: '1 186 420 ₽', l1: '+96 300 ₽ · +8,8 %', l1s: mint, range: '12 марта – 30 мая', more: 'ещё 5 месяцев →', d: ZOOM, fill: fill(ZOOM), a1: '12 мар', a2: '20 апр', a3: '30 мая', chips: chips(-1), fades: true };
    return {
      frames: [
        Object.assign({}, base, all, { n: '1', cap: 'Щипок двумя пальцами — увеличить', fingers: ['left:124px;top:154px', 'left:200px;top:154px'], arrows: ['left:84px;top:164px;transform:rotate(180deg)', 'left:246px;top:164px'] }),
        Object.assign({}, base, zoom, { n: '2', cap: 'Один палец тянет график, бросок — по инерции; края гаснут, пока дальше есть история', fingers: ['left:150px;top:154px'], arrows: ['left:196px;top:164px'] }),
        Object.assign({}, base, zoom, { n: '3', cap: 'Точка дня — только касанием с удержанием', sum: '1 104 200 ₽', l1: '14 апреля, вторник', l1s: 'color:#F0C878', scrub: true, fingers: ['left:183px;top:149px'], holds: ['left:173px;top:139px'] }),
        Object.assign({}, base, all, { n: '4', cap: 'Касание «Всё» — вся история', fingers: ['left:236px;top:310px'] })
      ]
    };
  }
}
</script>
</body>
</html>
