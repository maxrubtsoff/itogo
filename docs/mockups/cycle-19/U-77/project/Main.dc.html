body{margin:0;background:#0A0F0E}
.scr{--bg:#0A0F0E;--pt:#18211F;--pb:#111917;--inset:#0C1211;--fg:#EEF3F0;--muted:#8EA39B;--faint:#56655F;--line:rgba(255,255,255,.08);--brass:#D7A74A;--brass2:#F0C878;--mint:#59E2A6;--pill:rgba(215,167,74,.15);--bline:rgba(215,167,74,.33);--U:'Unbounded',sans-serif;--G:'Golos Text',sans-serif;background:var(--bg);color:var(--fg);font-family:var(--G);overflow:hidden;box-sizing:border-box}
.scr *{box-sizing:border-box}
.hdr{height:64px;display:flex;align-items:center;gap:4px;padding:0 8px}
.ib{width:48px;height:48px;display:grid;place-items:center;background:none;border:0;color:var(--fg);padding:0}
.t18{font:600 18px/22px var(--U);margin:0}
.tabs{display:grid;grid-auto-flow:column;gap:2px;padding:4px;border-radius:16px;background:var(--inset);border:1px solid var(--line);margin:4px 16px 0}
.tabs button{padding:9px 8px;border:0;border-radius:12px;background:none;color:var(--muted);font:500 13px/18px var(--G);white-space:nowrap}
.tabs .on{background:var(--pill);color:var(--brass2)}
.panel{background:linear-gradient(180deg,var(--pt),var(--pb));border:1px solid var(--line);border-radius:20px;position:relative;overflow:hidden}
.glow::before{content:"";position:absolute;width:150%;aspect-ratio:1;left:-45%;top:-62%;background:radial-gradient(closest-side,rgba(240,200,120,.14),transparent);pointer-events:none}
.hero{font:700 34px/38px var(--U);letter-spacing:-.5px;font-feature-settings:"tnum"}
.sm{font:600 13px/16px var(--U);font-feature-settings:"tnum";white-space:nowrap}
.b16{font:400 16px/22px var(--G)}
.b14{font:400 14px/20px var(--G)}
.b12{font:400 12px/16px var(--G);color:var(--muted)}
.ax{font:400 11px/14px var(--G);color:var(--faint)}
.mu{color:var(--muted)}.mi{color:var(--mint)}
.pc{height:30px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--inset);color:var(--muted);font:500 13px/1 var(--G)}
.mini{display:block;width:100%;height:44px;padding:8px 0;background:none;border:0}
.grp{margin:12px 16px 0}
.hl{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 16px}
.hl+.hl{border-top:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--brass2)}
.grow{flex:1;min-width:0}
</style>
</helmet>
